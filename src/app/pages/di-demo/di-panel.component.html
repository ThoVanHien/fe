<article class="topic-card di-panel-card">
  <span class="topic-number">P</span>
  <h2>{{ title }}</h2>
  <p>
    Panel nay tu cung cap `PanelStateService`, nen count va instance id khong giong panel ben canh.
    Root session van giu nguyen.
  </p>

  <div class="definition-list">
    <div>
      <dt>Panel state id</dt>
      <dd><code>{{ panelState.instanceId }}</code></dd>
    </div>
    <div>
      <dt>Local count</dt>
      <dd>{{ panelState.localCount }}</dd>
    </div>
    <div>
      <dt>Root session</dt>
      <dd><code>{{ session.instanceId }}</code></dd>
    </div>
  </div>

  <div class="quick-actions">
    <button class="button" type="button" (click)="bumpLocalCounter()">Tang local count</button>
  </div>

  <app-di-scope-probe></app-di-scope-probe>
</article>
