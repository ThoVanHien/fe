<section class="admin-page">
  <div class="section-heading compact">
    <p class="eyebrow">Rights</p>
    <h2>Role permissions</h2>
  </div>

  <mat-card>
    <form class="form-panel inline-form" (ngSubmit)="addRight()">
      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select name="role" [(ngModel)]="newRight.role">
          <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Permission</mat-label>
        <mat-select name="permission" [(ngModel)]="newRight.permission">
          <mat-option *ngFor="let permission of permissions" [value]="permission">
          {{ permission | permissionLabel }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Area</mat-label>
        <input matInput type="text" name="area" [(ngModel)]="newRight.area" required placeholder="Posts">
      </mat-form-field>

      <mat-checkbox name="enabled" [(ngModel)]="newRight.enabled">Enabled</mat-checkbox>

      <button mat-flat-button color="primary" type="submit" *appHasRole="'Admin'">Add right</button>
    </form>
  </mat-card>

  <div class="table-wrap">
    <table mat-table [dataSource]="rights">
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let right">
          <mat-chip-set>
            <mat-chip>{{ right.role }}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="permission">
        <th mat-header-cell *matHeaderCellDef>Permission</th>
        <td mat-cell *matCellDef="let right">{{ right.permission | permissionLabel }}</td>
      </ng-container>

      <ng-container matColumnDef="area">
        <th mat-header-cell *matHeaderCellDef>Area</th>
        <td mat-cell *matCellDef="let right">{{ right.area }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let right">
          <mat-chip-set>
            <mat-chip [class.status-active]="right.enabled" [class.status-muted]="!right.enabled">
              {{ right.enabled ? 'Enabled' : 'Disabled' }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let right">
          <button mat-stroked-button type="button" (click)="toggleRight(right.id)">
            {{ right.enabled ? 'Disable' : 'Enable' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="rightColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: rightColumns;"></tr>
    </table>
  </div>
</section>
